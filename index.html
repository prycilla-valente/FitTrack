<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Acompanhe seus treinos e hábitos</title>
    <link rel="icon" href="img/favicon-16x16.png" type="image/x-icon">

    <!-- Google Fonts do projeto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

    <!-- CSS Bootstrap (somente CSS, sem o bundle JS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />

    <!-- Css do projeto -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsividade.css">
</head>

<body>

    <header>
        <!-- ETAPA 1: NAVBAR

             JUSTIFICATIVA (sem Bootstrap JS):
             O botão "hambúrguer" (navbar-toggler) depende do JavaScript do Bootstrap para
             abrir/fechar o menu. Como o JS é proibido, o comportamento visual alternativo é:
             - navbar-expand-lg: a partir de 992px o menu fica horizontal.
             - collapse + navbar-collapse + d-block: abaixo de 992px o menu fica sempre visível
               e empilhado na vertical (a classe .collapse esconderia o menu sem JS, então
               d-block sobrescreve isso).
             - d-lg-flex: em telas grandes o menu volta a ser flex (horizontal).
             - sticky-top (em vez de fixed-top): mantém a navbar no fluxo da página, então o
               conteúdo (hero) nunca entra por baixo do header. -->
        <nav class="navbar navbar-expand-lg sticky-top bg-secondary-color" id="navbar">

            <div class="container py-3">
                <!-- Logo e nome do site -->
                <a class="navbar-brand primary-color" href="#">
                    <img src="img/fitness-svgrepo-com.svg" alt="Logo FitTrack">
                    <span class="primary-color">FitTrack</span>
                </a>

                <div class="collapse navbar-collapse d-block d-lg-flex" id="navbar-items">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a href="#" class="nav-link active primary-color" aria-current="page">Início</a>
                        </li>
                        <li class="nav-item">
                            <a href="#treinos" class="nav-link primary-color">Treinos</a>
                        </li>
                        <li class="nav-item">
                            <a href="#habitos" class="nav-link primary-color">Hábitos</a>
                        </li>
                        <li class="nav-item">
                            <a href="#contact-container" class="nav-link primary-color">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- ETAPA 2: HERO SECTION -->
        <section id="hero" class="bg-primary-color">
            <div class="container">
                <!-- align-items-center: centraliza verticalmente texto e imagem -->
                <div class="row align-items-center g-4 py-5">

                    <!-- Texto: abaixo do md vem DEPOIS da imagem (order-2); a partir do md vem antes (order-md-1) -->
                    <div class="col-12 col-md-6 order-2 order-md-1 text-center text-md-start">
                        <h1 class="display-5 fw-bold primary-color">Sua evolução começa hoje</h1>
                        <p class="lead secondary-color">Acompanhe seus treinos e hábitos com o FitTrack.</p>

                        <div class="d-grid d-sm-flex gap-2 justify-content-sm-center justify-content-md-start">
                            <a href="#treinos" class="btn btn-success btn-lg">Começar agora</a>
                            <a href="#habitos" class="btn btn-outline-dark btn-lg">Saiba mais</a>
                        </div>
                    </div>

                    <!-- Imagem: aparece primeiro no mobile (order-1) e à direita no md+ (order-md-2) -->
                    <div class="col-12 col-md-6 order-1 order-md-2 text-center">
                        <img src="img/foto-2.jpg" class="img-fluid hero-img"
                            alt="Foto de treino">
                    </div>

                </div>
            </div>
        </section>
    </main>

</body>
</html>
